PKG_FIELDS_BRASIL="Brazilian Custom Fields Package"
PKG_FIELDS_BRASIL_XML_DESCRIPTION="Complete suite of 6 Brazilian custom field plugins for Joomla 6: CPF (Law 14,534/2023), CNPJ (including the new Alphanumeric format of RFB IN No. 2,229/2024), CEP (automated address lookup via ViaCEP), Phone/WhatsApp (8/9-digit dynamic mask and click-to-chat button), Hybrid CPF/CNPJ (adaptive mask), and Pix Key (automatic QR Code and EMVCo payload generator)."
