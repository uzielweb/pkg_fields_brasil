PKG_FIELDS_BRASIL="Pacote de Campos Customizados para Brasil"
PKG_FIELDS_BRASIL_XML_DESCRIPTION="Suíte completa de 6 plugins de campos customizados (Custom Fields) para Joomla 6 adaptados ao Brasil: CPF (Lei 14.534/2023), CNPJ (incluindo o novo Alfanumérico da IN RFB nº 2.229/2024), CEP (com auto-preenchimento ViaCEP), Telefone/WhatsApp (8 e 9 dígitos com link/botão para WhatsApp), CPF/CNPJ Híbrido (máscara adaptativa) e Chave PIX (gerador de QR Code e Pix Copia e Cola EMVCo)."
